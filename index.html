<!DOCTYPE html>
<html>
<head>
  <title>OCR Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="hero">
    <h1>Extract Text from PDFs</h1>
    <p>Private. Fast. Runs entirely in your browser.</p>
  </div>

  <div class="upload-card">

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <p>📄 Drag & drop PDF or click to upload</p>
      <input type="file" id="fileInput" accept="application/pdf" hidden>
    </div>

    <button class="primary-btn" id="extractBtn" onclick="processPDF()">
      Extract Text
    </button>

    <div class="progress-container">
      <div id="progress"></div>
    </div>

    <p id="status"></p>

    <textarea id="output" placeholder="Extracted text will appear here..."></textarea>

    <button class="secondary-btn" onclick="downloadText()">
      Download Text
    </button>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2"></script>
<script src="script.js"></script>

</body>
</html>
