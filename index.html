<!DOCTYPE html>
<html>
<head>
  <title>PDF to Text OCR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>📄 PDF to Text (Free OCR)</h2>

<input type="file" id="fileInput" accept="application/pdf">
<button onclick="processPDF()">Extract Text</button>

<p id="status"></p>

<textarea id="output" placeholder="Extracted text will appear here..."></textarea>

<button onclick="downloadText()">Download Text</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2"></script>
<script src="script.js"></script>

</body>
</html>
