<!DOCTYPE html>
<html>
<head>
  <title>OCR Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <h1>Extract Text from PDFs in Seconds</h1>
  <p>Private. Fast. Runs directly in your browser.</p>
</div>

<div class="upload-card">

  <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
    <p>📄 Drag & drop PDF here or click to upload</p>
    <input type="file" id="fileInput" accept="application/pdf" hidden>
  </div>

  <button id="extractBtn" onclick="processPDF()">Extract Text</button>

  <div class="progress-container">
    <div id="progress"></div>
  </div>

  <p id="status"></p>

  <textarea id="output" placeholder="Your extracted text will appear here..."></textarea>

  <button class="secondary" onclick="downloadText()">Download Text</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2"></script>
<script src="script.js"></script>

</body>
</html>
